version: "3.8"

# BO 14 Feb 2023: new server, app runs under uvicorn now (was gunicorn)
services:
  app:
    image: python:3.11-slim
    working_dir: /srv/app
    command: sh -c "pip install -q -r requirements.txt pyyaml && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    env_file: .env
    volumes:
      - ./:/srv/app
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.23
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/srv/web:ro
      - ./logs:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped
