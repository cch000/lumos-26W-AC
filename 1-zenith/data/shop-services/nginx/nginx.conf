worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    access_log    off;
    error_log     /var/log/nginx/nginx_error.log warn;

    upstream zenith_app {
        server app:5000;
        server app:8000;    # BO: added after the move
    }

    server {
        listen 80;
        server_name api.zenithactive.com;

        # cart.js for the Shopify theme
        location /static/ {
            alias /srv/web/;
            add_header Access-Control-Allow-Origin *;
        }

        # location /admin {
        #     allow 10.0.0.0/8;
        #     deny all;
        #     proxy_pass http://zenith_app;
        # }

        location / {
            proxy_pass http://zenith_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
            add_header Access-Control-Allow-Origin *;
        }
    }
}
